name: liability-cap-auditor
version: 1.0.0
description: "Validates proposed limitation of liability caps against annual contract value (ACV) thresholds"
input_schema:
  type: object
  properties:
    cap_data_json:
      type: string
      description: "JSON string containing acv and liability_cap in USD"
  required:
    - cap_data_json
implementation:
  type: script
  path: liability_cap_auditor.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
